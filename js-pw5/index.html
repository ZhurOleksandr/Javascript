<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Практична робота 5 — Об'єкти</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.5; }
    section { margin-bottom: 24px; padding: 16px; border: 1px solid #ddd; border-radius: 10px; }
    label { display: block; margin: 8px 0 4px; }
    input, select, button, textarea { padding: 8px; width: 100%; max-width: 420px; box-sizing: border-box; }
    button { cursor: pointer; margin-top: 10px; max-width: 220px; }
    pre { background: #f7f7f7; padding: 12px; border-radius: 8px; overflow: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; }
  </style>
</head>
<body>
  <h1>Практична робота 5: Об'єкти</h1>

  <section>
    <h2>Створити користувача</h2>
    <div class="row">
      <div>
        <label for="name">Ім'я</label>
        <input id="name" type="text" placeholder="Ivan" />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="ivan@example.com" />
      </div>
      <div>
        <label for="role">Роль</label>
        <select id="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </div>
    </div>
    <button id="createBtn">Створити</button>
  </section>

  <section>
    <h2>Користувачі</h2>
    <button id="loadBtn">Показати всіх</button>
    <pre id="output">Натисніть "Показати всіх".</pre>
  </section>

  <script src="app.js"></script>
</body>
</html>
